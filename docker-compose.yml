services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  downstream_mock:
    build: ./downstream_mock
    ports:
      - "9000:9000"
    environment:
      FLAKY_FAILURE_RATE: "0.5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "8000"  # no fixed host port: needed so `--scale gateway=3` doesn't
                # collide trying to bind :8000 three times. Docker assigns
                # each replica its own host port; `docker compose port
                # gateway <n>` (or `docker compose ps`) reveals it.
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      DOWNSTREAM_BASE_URL: http://downstream_mock:9000
      JWT_SECRET: dev-secret-change-me
      API_KEYS_RAW: demo-key-123:demo-client
    depends_on:
      redis:
        condition: service_healthy
      downstream_mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 5

# To prove distributed rate limiting (Phase 6):
#   docker compose up --build --scale gateway=3 -d
#   docker compose port gateway 1   (repeat with 2, 3 for each replica's host port)
# All 3 replicas share one Redis, so hitting the *same client* across all
# 3 host ports must still enforce one combined limit, not 3x.
